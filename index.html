<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ガチャマシーン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <main class="stage">
    <div class="bg"></div>

    <header class="top">
      <h1 id="title"></h1>
      <p class="stats" id="stats"></p>
      <p class="stats" id="syncStatus"></p>
    </header>

    <div class="machine" id="machine">
      <!-- 画像が無いときの CSS 描画マシン -->
      <div class="fm fm-base"></div>
      <div class="fm fm-body"></div>
      <div class="fm fm-cap"></div>
      <div class="fm fm-plate"></div>
      <div class="fm fm-slot"></div>

      <img class="machine-img" id="machineImg" alt="">

      <div class="dome" id="dome">
        <canvas id="domeCanvas"></canvas>
        <div class="dome-glass"></div>
      </div>
      <div class="fm fm-collar"></div>

      <button class="knob" id="knob" type="button" aria-label="ハンドルを回す">
        <span class="knob-rot" id="knobRot">
          <img id="knobImg" alt="">
          <span class="knob-fallback"></span>
        </span>
      </button>

      <div class="outlet" id="outlet"><canvas id="outCanvas"></canvas></div>
    </div>

    <div class="controls">
      <button class="btn ghost" id="undoBtn" type="button">↩ 1つ戻す</button>
      <button class="btn primary" id="pullBtn" type="button">回す</button>
      <button class="btn ghost" id="resetBtn" type="button">全部戻す</button>
    </div>
  </main>

  <aside class="panel">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="items" class="on">中身</button>
      <button type="button" data-tab="history">履歴</button>
      <button type="button" data-tab="settings">設定</button>
    </nav>

    <section class="pane on" data-pane="items">
      <form class="add" id="addForm">
        <input id="addInput" type="text" placeholder="中身を追加（Enter）" autocomplete="off">
        <button class="btn small" type="submit">追加</button>
      </form>
      <ul class="list" id="itemList"></ul>
      <details class="bulk">
        <summary>まとめて編集（1行に1つ）</summary>
        <textarea id="bulkText" rows="8" spellcheck="false"></textarea>
        <button class="btn small" id="bulkApply" type="button">この内容で反映</button>
      </details>
    </section>

    <section class="pane" data-pane="history">
      <div class="pane-actions">
        <button class="btn small" id="undoBtn2" type="button">↩ 直前の当選を取り消す</button>
        <button class="btn small danger" id="clearHistory" type="button">履歴を全消去</button>
      </div>
      <ul class="list" id="historyList"></ul>
    </section>

    <section class="pane" data-pane="settings">
      <label class="field">タイトル
        <input id="titleInput" type="text">
      </label>
      <label class="check"><input id="optSound" type="checkbox"> 効果音</label>
      <label class="check"><input id="optFast" type="checkbox"> 演出を短縮</label>

      <h3>端末間の同期</h3>
      <p class="hint" id="syncStatus2"></p>
      <div id="syncOff">
        <p class="hint">GitHub の<a href="https://github.com/settings/tokens/new?scopes=gist&description=gacha-sync" target="_blank" rel="noopener">トークン作成ページ</a>で「gist」だけにチェックを入れたトークンを作り、使う端末それぞれでここに貼り付けてください。中身と履歴が自動で共有されます。</p>
        <form class="add" id="syncForm">
          <input id="syncToken" type="password" placeholder="ghp_..." autocomplete="off">
          <button class="btn small" type="submit">接続</button>
        </form>
      </div>
      <div class="pane-actions" id="syncOn" hidden>
        <button class="btn small" id="syncNow" type="button">今すぐ同期</button>
        <button class="btn small danger" id="syncDisconnect" type="button">この端末の同期を解除</button>
      </div>

      <h3>スプライト画像</h3>
      <ul class="sprites" id="spriteStatus"></ul>
      <p class="hint">assets フォルダに画像を置いて再読み込みすると自動で切り替わります。</p>

      <h3>位置合わせ</h3>
      <p class="hint">マシン画像に合わせて、ドーム・ハンドル・取り出し口の位置を調整します（点線がガイド）。</p>
      <div id="layoutSliders"></div>
      <button class="btn small" id="layoutReset" type="button">位置合わせを初期値に戻す</button>
    </section>
  </aside>
</div>

<div class="reveal" id="reveal">
  <div class="rv-wrap">
    <div class="rv-center">
      <div class="burst"></div>
      <div class="caps">
        <canvas class="half top" id="halfTop" width="480" height="480"></canvas>
        <canvas class="half bot" id="halfBot" width="480" height="480"></canvas>
      </div>
      <div class="rv-name" id="rvName"></div>
    </div>
    <p class="rv-meta" id="rvMeta"></p>
    <div class="rv-actions">
      <button class="btn ghost" id="rvUndo" type="button">この当選を取り消す</button>
      <button class="btn primary" id="rvOk" type="button">OK</button>
    </div>
  </div>
</div>
<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
